    <meta property="og:title" content="Apple Macintosh — Ryan Dsouza" />
    <meta property="og:description" content="A 1984 Macintosh 128K built entirely in code — procedural Three.js with a live, clickable System 1.0 on the CRT. Click the screen: it turns on." />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
    <style>
      html, body { margin: 0; padding: 0; background: #f4f2ec; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      /* 1984-ad intro: cream paper, garamond ink, typed on */
      #intro {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f2ec;
        transition: opacity 0.9s ease;
      }
      #intro.away { opacity: 0; pointer-events: none; }
      #intro .line {
        font-family: 'EB Garamond', 'Iowan Old Style', 'Palatino', 'Georgia', serif;
        font-size: clamp(30px, 5.6vw, 68px);
        color: #14140f;
        letter-spacing: -0.01em;
        transform: scaleX(0.94); /* apple-garamond narrowness */
        white-space: nowrap;
        padding: 0 24px;
      }
      #intro .caret {
        display: inline-block;
        width: 0.52em;
        height: 0.08em;
        margin-left: 0.07em;
        background: #14140f;
        vertical-align: baseline;
        animation: intro-blink 1s steps(1) infinite;
      }
      @keyframes intro-blink { 50% { opacity: 0; } }
      @media (max-width: 640px) {
        #intro .line { white-space: normal; text-align: center; line-height: 1.15; }
      }
      /* a little System 1.0 window, ink on paper */
      #hints {
        position: fixed;
        left: 18px;
        bottom: 18px;
        font: 12px/1.75 'Geneva', 'Lucida Grande', 'Helvetica Neue', sans-serif;
        color: #0a0a0a;
        background: #eeeeec;
        border: 1.5px solid #0a0a0a;
        box-shadow: 2px 2px 0 #0a0a0a;
        pointer-events: none;
        transition: opacity 1.2s;
        z-index: 2;
      }
      #hints .bar {
        position: relative;
        height: 17px;
        border-bottom: 1.5px solid #0a0a0a;
        background:
          repeating-linear-gradient(#eeeeec 0 2px, #0a0a0a 2px 3px);
        background-clip: content-box;
        padding: 2px 4px;
      }
      #hints .bar span {
        position: absolute;
        top: 1px;
        left: 50%;
        transform: translateX(-50%);
        padding: 0 8px;
        background: #eeeeec;
        font-weight: 700;
        font-size: 11px;
        line-height: 15px;
        letter-spacing: 0.02em;
      }
      #hints .body { padding: 8px 14px 9px; }
      #hints b { font-weight: 700; }
      #hints .dot { padding: 0 6px; }
      #hints.faded { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="intro" aria-label="Introducing the Apple Macintosh">
      <p class="line"><span id="intro-typed"></span><span class="caret"></span></p>
    </div>
    <script>
      // starts typing immediately, while the module is still downloading;
      // dissolves once the text is read AND the scene reports ready
      (function () {
        var text = 'Introducing the Apple Macintosh.';
        var typed = document.getElementById('intro-typed');
        var intro = document.getElementById('intro');
        var i = 0;
        var doneTyping = false;
        var sceneReady = false;
        var holdUntil = Infinity;
        function tick() {
          i += 1;
          typed.textContent = text.slice(0, i);
          if (i < text.length) {
            setTimeout(tick, 46 + Math.random() * 42);
          } else {
            doneTyping = true;
            holdUntil = Date.now() + 900;
            maybeDismiss();
          }
        }
        function maybeDismiss() {
          if (!doneTyping || !sceneReady) return;
          var wait = Math.max(0, holdUntil - Date.now());
          setTimeout(function () {
            intro.classList.add('away');
            setTimeout(function () { intro.remove(); }, 1000);
          }, wait);
        }
        window.__introSceneReady = function () {
          sceneReady = true;
          maybeDismiss();
        };
        setTimeout(tick, 350);
      })();
    </script>
    <div id="app"></div>
    <div id="hints">
      <div class="bar"><span>How to use</span></div>
      <div class="body">
        <b>click the screen</b> to power it on, then menus, windows &amp; icons work<br />
        <b>scroll</b> or <b>esc</b> to see the whole computer<span class="dot">·</span>click the screen to go back<br />
        <b>type</b> to press the keys<span class="dot">·</span>click the mouse to click
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
