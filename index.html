<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apple Macintosh — Ryan Dsouza</title>
    <meta name="description" content="A 1984 Macintosh 128K built entirely in code — procedural Three.js with a live, clickable System 1.0 on the CRT. Click the screen: it turns on." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23E7E3D9'/><rect x='6' y='5' width='20' height='15' rx='2' fill='%23DAD5C8'/><rect x='9' y='8' width='14' height='9' rx='1' fill='%23262626'/><rect x='12' y='23' width='12' height='2.6' rx='1.3' fill='%23262626'/></svg>" />
    <meta property="og:title" content="Apple Macintosh — Ryan Dsouza" />
    <meta property="og:description" content="A 1984 Macintosh 128K built entirely in code — procedural Three.js with a live, clickable System 1.0 on the CRT. Click the screen: it turns on." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://apple-macintosh.vercel.app" />
    <meta property="og:image" content="https://apple-macintosh.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://apple-macintosh.vercel.app/og.png" />
    <style>
      html, body { margin: 0; padding: 0; background: #f4f2ec; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      /* a little System 1.0 window, ink on paper */
      #hints {
        position: fixed;
        left: 18px;
        bottom: 18px;
        font: 12px/1.75 'Geneva', 'Lucida Grande', 'Helvetica Neue', sans-serif;
        color: #0a0a0a;
        background: #eeeeec;
        border: 1.5px solid #0a0a0a;
        box-shadow: 2px 2px 0 #0a0a0a;
        pointer-events: none;
        transition: opacity 1.2s;
        z-index: 2;
      }
      #hints .bar {
        position: relative;
        height: 17px;
        border-bottom: 1.5px solid #0a0a0a;
        background:
          repeating-linear-gradient(#eeeeec 0 2px, #0a0a0a 2px 3px);
        background-clip: content-box;
        padding: 2px 4px;
      }
      #hints .bar span {
        position: absolute;
        top: 1px;
        left: 50%;
        transform: translateX(-50%);
        padding: 0 8px;
        background: #eeeeec;
        font-weight: 700;
        font-size: 11px;
        line-height: 15px;
        letter-spacing: 0.02em;
      }
      #hints .body { padding: 8px 14px 9px; }
      #hints b { font-weight: 700; }
      #hints .dot { padding: 0 6px; }
      #hints.faded { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hints">
      <div class="bar"><span>How to use</span></div>
      <div class="body">
        <b>click the screen</b> to power it on, then menus, windows &amp; icons work<br />
        <b>scroll</b> or <b>esc</b> to see the whole computer<span class="dot">·</span>click the screen to go back<br />
        <b>type</b> to press the keys<span class="dot">·</span>click the mouse to click
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
