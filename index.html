<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Macintosh 128K</title>
    <style>
      html, body { margin: 0; padding: 0; background: #f4f2ec; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; }
      #hints {
        position: fixed;
        left: 18px;
        bottom: 16px;
        font: 12px/1.7 'Geneva', 'Helvetica Neue', sans-serif;
        color: #6e6a61;
        background: rgba(244, 242, 236, 0.82);
        border: 1px solid #d5d1c5;
        border-radius: 6px;
        padding: 10px 14px;
        pointer-events: none;
        transition: opacity 1.2s;
        z-index: 2;
      }
      #hints b { color: #3a3a38; font-weight: 600; }
      #hints.faded { opacity: 0; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="hints">
      <b>click the screen</b> to power it on — then menus, windows &amp; icons work<br />
      <b>scroll</b> or <b>esc</b> to see the whole computer &nbsp;·&nbsp; click the screen to go back<br />
      <b>type</b> to press the keys &nbsp;·&nbsp; click the mouse to click
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
